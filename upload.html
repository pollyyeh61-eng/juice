<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>產品快傳 | 數位王國</title>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-[#1a2233] text-white p-4 flex justify-between items-center sticky top-0 z-50 shadow-md">
        <div class="flex items-center gap-2">
            <button onclick="window.location.href='index.html'" class="bg-[#3d4455] px-4 py-2 rounded-lg text-sm font-black italic">🏠 返回前台</button>
            <span class="text-purple-400 font-black ml-2 tracking-widest italic">UPLOAD</span>
        </div>
    </nav>

    <div class="max-w-md mx-auto p-6 space-y-6">
        <div class="text-center py-4">
            <h1 class="text-3xl font-black text-stone-900 italic">快速上架產品</h1>
            <p class="text-stone-600 text-sm font-bold mt-2">拍照後會自動縮圖，加快上傳速度</p>
        </div>

        <section class="bg-white rounded-[2.5rem] p-8 shadow-xl border-2 border-white space-y-6">
            <div class="space-y-2">
                <label class="text-sm font-black text-stone-900 ml-2 uppercase">產品名稱</label>
                <input type="text" id="new-p-name" placeholder="例如：精緻洗剪" class="w-full bg-gray-50 rounded-2xl p-5 text-lg border-2 border-gray-100 focus:border-purple-500 outline-none font-black text-stone-800">
            </div>

            <div class="space-y-2">
                <label class="text-sm font-black text-stone-900 ml-2 uppercase">設定價格</label>
                <input type="number" id="new-p-price" placeholder="例如：1200" class="w-full bg-gray-50 rounded-2xl p-5 text-2xl border-2 border-gray-100 focus:border-purple-500 outline-none font-black text-stone-800">
            </div>
            
            <div class="pt-2">
                <label class="block w-full p-10 bg-purple-50 text-purple-600 rounded-[2rem] text-center border-4 border-dashed border-purple-200 cursor-pointer active:scale-95 transition-all">
                    <span class="text-5xl block mb-3">📸</span>
                    <span class="text-lg font-black" id="file-label-text">點擊拍照或選取產品照</span>
                    <input type="file" id="new-p-file" accept="image/*" class="hidden" onchange="previewFile(this)">
                </label>
                <canvas id="canvas" class="hidden"></canvas>
            </div>

            <button onclick="uploadProduct()" id="upload-btn" class="w-full bg-purple-600 text-white py-5 rounded-[2.5rem] font-black shadow-xl active:scale-95 transition-all mt-4 italic text-2xl">
                確認發佈 🚀
            </button>
        </section>

        <section class="mt-10">
            <h3 class="text-lg font-black text-stone-900 mb-4 px-4 italic border-l-4 border-purple-500 ml-2">目前已上架</h3>
            <div id="dynamicProductList" class="space-y-4"></div>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getStorage, ref as sRef, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDcZovSDeUlF-SbWrgXY74ZCK7t5-VSnj4",
            authDomain: "studio-2370518507-ee5e3.firebaseapp.com",
            databaseURL: "https://studio-2370518507-ee5e3-default-rtdb.firebaseio.com",
            projectId: "studio-2370518507-ee5e3",
            // 關鍵修正：對齊您的截圖地址
            storageBucket: "studio-2370518507-ee5e3.firebasestorage.app",
            appId: "1:143237430916:web:e66f040d02930a1a7e8cd1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);

        window.previewFile = (input) => {
            if (input.files && input.files[0]) {
                document.getElementById('file-label-text').innerText = "✅ 照片已選好";
                document.getElementById('file-label-text').className = "text-lg font-black text-green-600";
            }
        };

        async function getCompressedBlob(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.getElementById('canvas');
                        const ctx = canvas.getContext('2d');
                        const max_w = 800; 
                        const scale = max_w / img.width;
                        canvas.width = max_w;
                        canvas.height = img.height * scale;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.8);
                    };
                };
            });
        }

        window.uploadProduct = async () => {
            const btn = document.getElementById('upload-btn');
            const name = document.getElementById('new-p-name').value;
            const price = document.getElementById('new-p-price').value;
            const file = document.getElementById('new-p-file').files[0];

            if (!name || !price || !file) return alert("⚠️ 資訊不完整喔！");

            btn.disabled = true;
            btn.innerText = "⚡ 縮圖並上傳中...";

            try {
                const blob = await getCompressedBlob(file);
                const filePath = `products/${Date.now()}.jpg`;
                const fileRef = sRef(storage, filePath);
                
                await uploadBytes(fileRef, blob);
                const url = await getDownloadURL(fileRef);

                await push(ref(db, 'products'), {
                    name, 
                    price: parseInt(price), 
                    image: url, 
                    storagePath: filePath,
                    time: new Date().toLocaleString()
                });

                alert("✅ 上架成功！");
                location.reload();
            } catch (e) { 
                alert("❌ 上傳失敗：" + e.message); 
                btn.disabled = false;
                btn.innerText = "確認發佈 🚀";
            }
        };

        onValue(ref(db, 'products'), (snapshot) => {
            const listDiv = document.getElementById('dynamicProductList');
            const data = snapshot.val();
            if (!data) { listDiv.innerHTML = '<p class="text-center text-stone-400 py-10 font-bold">目前沒有產品</p>'; return; }
            listDiv.innerHTML = Object.entries(data).map(([id, p]) => `
                <div class="flex items-center justify-between bg-white p-5 rounded-[2rem] shadow-sm">
                    <div class="flex items-center gap-4">
                        <img src="${p.image}" class="w-16 h-16 rounded-2xl object-cover shadow-inner">
                        <div>
                            <p class="text-lg font-black text-stone-900">${p.name}</p>
                            <p class="text-md font-bold text-purple-600">$${p.price}</p>
                        </div>
                    </div>
                    <button onclick="deleteProduct('${id}', '${p.storagePath}')" class="bg-red-50 text-red-500 text-sm px-5 py-3 rounded-full font-black">下架</button>
                </div>
            `).reverse().join('');
        });

        window.deleteProduct = async (id, path) => {
            if (!confirm("確定要下架此產品嗎？")) return;
            if (path) await deleteObject(sRef(storage, path)).catch(e => console.log("圖片已刪除"));
            await remove(ref(db, `products/${id}`));
        };
    </script>
</body>
</html>
