<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>芭樂汁 | 會員預購中心 🍹</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; font-family: sans-serif; }
        .btn-active:active { transform: scale(0.95); }
    </style>
</head>
<body class="bg-[#F8F9FA] min-h-screen">

    <main class="max-w-md mx-auto p-4 pb-48"> 
        <div class="flex flex-col mb-6">
            <div class="flex justify-between items-start w-full">
                <div class="flex items-center gap-2">
                    <h1 class="text-3xl font-black text-green-500 italic tracking-tighter">芭樂汁預購</h1>
                    <span class="text-2xl">🍹</span>
                </div>
                
                <div class="flex flex-col items-end gap-1 text-right">
                    <div id="auth-section" class="mb-2">
                        <button onclick="login()" class="bg-white px-3 py-1.5 rounded-full shadow-sm border border-stone-100 text-[10px] font-bold text-stone-500 btn-active">👤 會員登入</button>
                    </div>
                    <div id="status-badge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-gray-100 text-gray-400">狀態讀取中</div>
                </div>
            </div>

            <div class="mt-3 bg-orange-50 p-3 rounded-2xl border border-orange-100">
                <p class="text-[11px] font-bold text-orange-600 leading-relaxed">
                    親愛的顧客，開放預購明天的訂單，請您填好訂單並準時領取產品，謝謝。
                </p>
            </div>

<div class="flex items-center gap-3 bg-[#E8F5E9] px-4 py-2 rounded-full border border-green-100 mt-3 w-fit">
                <div class="bg-green-500 text-white text-[10px] px-2 py-1 rounded-full font-bold leading-none text-center flex-shrink-0">取貨點</div>
                <div class="flex items-center gap-2 whitespace-nowrap"> 
                    <span id="display-location" class="text-[11px] font-bold text-stone-600 italic">讀取中...</span>
                    <span id="display-time" class="text-[10px] text-stone-400 italic font-medium">讀取時間中...</span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-4 gap-2 mb-8">
            <button id="installBtn" onclick="installPWA()" class="bg-red-50 py-3 rounded-xl flex flex-col items-center border border-red-100 btn-active" style="display: none;">
                <span class="text-xs font-bold text-red-500">📲 下載</span>
            </button>
            <button onclick="copyLink()" class="bg-blue-50 py-3 rounded-xl flex flex-col items-center border border-blue-100 btn-active">
                <span class="text-xs font-bold text-blue-500">🔗 分享</span>
            </button>
            <button onclick="checkAuth('pos.html')" class="bg-orange-50 py-3 rounded-xl flex flex-col items-center border border-orange-100 btn-active text-center">
                <span class="text-xs font-bold text-orange-500">💰 收銀</span>
            </button>
            <button onclick="checkAuth('admin.html')" class="bg-green-50 py-3 rounded-xl flex flex-col items-center border border-green-100 btn-active text-center">
                <span class="text-xs font-bold text-green-500">⚙️ 管理</span>
            </button>
        </div>

        <div class="bg-white rounded-[2.5rem] overflow-hidden shadow-sm border border-stone-100 mb-6">
            <img src="5.png" class="w-full h-56 object-cover" onerror="this.src='https://via.placeholder.com/400x200?text=Guava+Hub'">
            <div class="p-8">
                <div class="flex items-center gap-2 mb-4">
                    <div class="w-1.5 h-6 bg-green-500 rounded-full"></div>
                    <h2 class="text-xl font-black text-stone-800 italic">慢磨鮮榨・原汁原味</h2>
                </div>
                <p class="text-stone-500 text-md leading-relaxed">
                    堅持慢磨技術，果渣分離保留最純粹維生素。承諾無糖、無水、無添加。
                </p>
            </div>
        </div>

        <div class="bg-orange-50/50 rounded-[2.5rem] p-8 mb-8 border border-orange-100/50">
            <h3 class="text-lg font-black text-orange-800 mb-4 flex items-center gap-2">🍋 建議喝法</h3>
            <ul class="space-y-4 text-sm font-bold text-orange-900/70">
                <li>1. 現喝最鮮：建議兩小時內飲用，口感最清爽。</li>
                <li>2. 微凍更爽：冷凍 15 分鐘，芭樂果味更有層次。</li>
                <li>3. 飲前搖勻：天然果膠易沉澱，搖一搖更美味。</li>
                <li>4. 加入甘梅：甘梅口味的芭樂汁別有一番風味。</li>
            </ul>
        </div>

        <div id="menu" class="space-y-4 mb-20"></div>
    </main>

    <div id="checkout-bar" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-md bg-white p-6 rounded-[2.5rem] shadow-2xl z-[100] translate-y-60 transition-all duration-500 border border-stone-100">
        <div class="flex flex-col gap-4">
            <div class="bg-stone-50 rounded-2xl p-3 border border-stone-100">
                <label class="text-[10px] font-black text-stone-400 ml-1 mb-1 block uppercase tracking-widest">預計取貨時間 PICKUP TIME</label>
                <input type="time" id="pickup-time" class="w-full bg-transparent font-black text-stone-700 outline-none">
            </div>

            <div class="flex justify-between items-center">
                <div class="pl-2">
                    <p class="text-2xl font-black text-green-600">$<span id="total-price">0</span></p>
                    <p class="text-[10px] text-gray-400 font-bold uppercase">Pre-order Total</p>
                </div>
                <button onclick="submitOrder()" class="bg-green-500 text-white px-10 py-4 rounded-[2rem] font-black btn-active shadow-lg shadow-green-200">立即預約</button>
            </div>
        </div>
    </div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDcZovSDeUlF-SbWrgXY74ZCK7t5-VSnj4",
    authDomain: "studio-2370518507-ee5e3.firebaseapp.com",
    databaseURL: "https://studio-2370518507-ee5e3-default-rtdb.firebaseio.com",
    projectId: "studio-2370518507-ee5e3",
    appId: "1:143237430916:web:e66f040d02930a1a7e8cd1"
};
if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
const db = firebase.database();
const auth = firebase.auth();

let currentUser = null;
let deferredPrompt;

function checkAuth(targetUrl) {
    const pwd = prompt("請輸入管理密碼：");
    if (pwd === "870224") { window.location.href = targetUrl; }
    else if (pwd !== null) { alert("密碼錯誤！"); }
}

function login() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider);
}

auth.onAuthStateChanged(user => {
    const authSec = document.getElementById('auth-section');
    if (user) {
        currentUser = user;
        authSec.innerHTML = `<img onclick="window.location.href='member.html'" src="${user.photoURL}" class="w-10 h-10 rounded-full border-2 border-white shadow-sm cursor-pointer btn-active object-cover">`;
    } else {
        currentUser = null;
        authSec.innerHTML = `<button onclick="login()" class="bg-white px-3 py-1.5 rounded-full shadow-sm border border-stone-100 text-[10px] font-bold text-stone-500 btn-active">👤 會員登入</button>`;
    }
});

const adminSettingsRef = db.ref('admin_settings');
adminSettingsRef.on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
        if (data.location) {
            document.getElementById('display-location').innerText = data.location.name || "未設定地點";
            document.getElementById('display-time').innerText = data.location.pos ? `(${data.location.pos})` : "";
        }
        const statusElement = document.getElementById('status-badge');
        if (statusElement) {
            const statusMap = {
                'open': { text: '🟢 營業中', class: 'bg-green-100 text-green-600' },
                'soldout': { text: '🟡 已售完', class: 'bg-yellow-100 text-yellow-600' },
                'closed': { text: '🔴 結束營業', class: 'bg-red-100 text-red-600' }
            };
            const currentStatus = statusMap[data.status] || { text: '待機中', class: 'bg-gray-100 text-gray-400' };
            statusElement.innerText = currentStatus.text;
            statusElement.className = `text-[10px] font-bold px-2 py-0.5 rounded-full ${currentStatus.class}`;
        }
        if (data.prices) {
            products[0].price = parseInt(data.prices.big_s);
            products[1].price = parseInt(data.prices.big_d);
            products[2].price = parseInt(data.prices.small_s);
            products[3].price = parseInt(data.prices.small_d);
            renderMenu();
        }
    }
});

const products = [
    { id: 'b1', name: '大瓶 (單瓶)', price: 70, img: '1.png' },
    { id: 'b2', name: '大瓶 (2瓶優惠組)', price: 120, img: '2.png' },
    { id: 's1', name: '小瓶 (單瓶)', price: 60, img: '3.png' },
    { id: 's2', name: '小瓶 (2瓶優惠組)', price: 100, img: '4.png' }
];
let cart = {};

function renderMenu() {
    document.getElementById('menu').innerHTML = products.map(p => `
        <div class="bg-white p-5 rounded-[2.5rem] flex items-center justify-between border border-stone-100 shadow-sm">
            <div class="flex items-center gap-4">
                <img src="${p.img}" class="w-16 h-16 object-cover rounded-2xl" onerror="this.src='https://via.placeholder.com/100'">
                <div>
                    <h4 class="font-bold text-stone-700 text-md italic">${p.name}</h4>
                    <p class="text-green-600 font-black text-xl">$${p.price}</p>
                </div>
            </div>
            <div class="flex items-center gap-4 bg-stone-50 p-2 rounded-full">
                <button onclick="updateCart('${p.id}', -1)" class="w-8 h-8 bg-white rounded-full shadow-sm font-black text-stone-300">-</button>
                <span class="font-black w-4 text-center text-stone-700 text-xs">${cart[p.id] || 0}</span>
                <button onclick="updateCart('${p.id}', 1)" class="w-8 h-8 bg-white rounded-full shadow-sm font-black text-green-500">+</button>
            </div>
        </div>`).join('');
}

function updateCart(id, change) {
    cart[id] = (cart[id] || 0) + change;
    if (cart[id] < 0) cart[id] = 0;
    renderMenu();
    updateUI();
}

function updateUI() {
    let total = 0, count = 0;
    Object.keys(cart).forEach(id => {
        total += (products.find(p => p.id === id).price || 0) * cart[id];
        count += cart[id];
    });
    document.getElementById('total-price').innerText = total;
    const bar = document.getElementById('checkout-bar');
    if (count > 0) bar.classList.replace('translate-y-60', 'translate-y-0');
    else bar.classList.replace('translate-y-0', 'translate-y-60');
}

async function submitOrder() {
    if (!currentUser) { alert("請先登入會員帳號喔！"); return; }
    const pickupTime = document.getElementById('pickup-time').value;
    if (!pickupTime) { alert("請選擇您的預計取貨時間喔！"); return; }

    const userSnap = await db.ref('users/' + currentUser.uid).get();
    const userProfile = userSnap.val() || {};
    const total = parseInt(document.getElementById('total-price').innerText);
    
    db.ref('orders').push({
        userName: currentUser.displayName,
        userPhone: userProfile.phone || "未填寫電話",
        userPhoto: currentUser.photoURL,
        email: currentUser.email,
        total: total,
        pickupTime: pickupTime,
        items: Object.keys(cart).filter(id => cart[id] > 0).map(id => ({ 
            name: products.find(p => p.id === id).name, 
            qty: cart[id] 
        })),
        status: "待處理",
        time: new Date().toLocaleString()
    }).then(() => {
        alert("預約成功！請於明天 " + pickupTime + " 準時領取。");
        cart = {}; updateUI(); renderMenu();
    });
}

function copyLink() { navigator.clipboard.writeText(window.location.href); alert('網址已複製！'); }
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; document.getElementById('installBtn').style.display = 'flex'; });
function installPWA() { if(deferredPrompt) deferredPrompt.prompt(); }

renderMenu();
</script>
</body>
</html>
