<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>芭樂汁後台管理</title>
    <style>
        /* 針對輸入框焦點加強視覺提示 */
        input:focus {
            border-color: #4ade80 !important;
            background-color: #ffffff !important;
            box-shadow: 0 0 0 4px rgba(74, 222, 128, 0.1);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-20">

    <nav class="bg-[#1a2233] text-white p-4 flex justify-between items-center sticky top-0 z-50 shadow-md">
        <div class="flex items-center gap-2">
            <button onclick="window.location.href='index.html'" class="bg-[#3d4455] px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-1">🏠 返回前台</button>
            <span class="text-[#4ade80] font-black ml-2 tracking-tighter">ADMIN</span>
        </div>
        <div class="bg-[#111827] px-4 py-2 rounded-full border border-gray-700 text-sm font-bold">
            今日狀態: <span id="currentStatusText" class="text-white">讀取中...</span>
        </div>
    </nav>

    <div class="max-w-md mx-auto p-4 space-y-6">

        <section class="bg-white rounded-[2rem] p-6 shadow-md border border-gray-200">
            <h2 class="text-2xl font-black mb-4 flex justify-between items-center text-stone-900">
                📦 今日預購訂單
                <span id="orderCount" class="bg-red-500 text-white text-sm px-3 py-1 rounded-full">0</span>
            </h2>
            <div id="orderList" class="space-y-4 max-h-[600px] overflow-y-auto pr-1">
                <p class="text-gray-400 text-center py-10">目前尚無預購訂單...</p>
            </div>
        </section>

        <section class="bg-white rounded-[2rem] p-6 shadow-md border border-gray-200">
            <h2 class="text-2xl font-black mb-8 flex items-center gap-2 text-stone-900">💰 價格與地點設置</h2>
            
            <p class="text-sm font-black text-green-700 mb-3 bg-green-50 inline-block px-3 py-1 rounded-lg">🍹 芭樂汁價格設定</p>
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div>
                    <label class="text-stone-900 text-sm font-black block mb-2 ml-1">大/單瓶</label>
                    <input type="number" id="price_big_single" class="w-full bg-gray-50 rounded-2xl p-4 text-xl font-black border-2 border-gray-100 shadow-inner">
                </div>
                <div>
                    <label class="text-stone-900 text-sm font-black block mb-2 ml-1">大/2瓶組</label>
                    <input type="number" id="price_big_double" class="w-full bg-gray-50 rounded-2xl p-4 text-xl font-black border-2 border-gray-100 shadow-inner">
                </div>
                <div>
                    <label class="text-stone-900 text-sm font-black block mb-2 ml-1">小/單瓶</label>
                    <input type="number" id="price_small_single" class="w-full bg-gray-50 rounded-2xl p-4 text-xl font-black border-2 border-gray-100 shadow-inner">
                </div>
                <div>
                    <label class="text-stone-900 text-sm font-black block mb-2 ml-1">小/2瓶組</label>
                    <input type="number" id="price_small_double" class="w-full bg-gray-50 rounded-2xl p-4 text-xl font-black border-2 border-gray-100 shadow-inner">
                </div>
            </div>

            <p class="text-sm font-black text-orange-700 mb-3 bg-orange-50 inline-block px-3 py-1 rounded-lg"> Melon 榴槤價格設定</p>
            <div class="grid grid-cols-3 gap-2 mb-8">
                <div>
                    <label class="text-stone-900 text-[12px] font-black block mb-2 ml-1 text-center">榴槤/1個</label>
                    <input type="number" id="price_d1" class="w-full bg-gray-50 rounded-2xl p-4 text-xl font-black border-2 border-gray-100 shadow-inner text-center">
                </div>
                <div>
                    <label class="text-stone-900 text-[12px] font-black block mb-2 ml-1 text-center">榴槤/2個</label>
                    <input type="number" id="price_d2" class="w-full bg-gray-50 rounded-2xl p-4 text-xl font-black border-2 border-gray-100 shadow-inner text-center">
                </div>
                <div>
                    <label class="text-stone-900 text-[12px] font-black block mb-2 ml-1 text-center">榴槤/3個</label>
                    <input type="number" id="price_d3" class="w-full bg-gray-50 rounded-2xl p-4 text-xl font-black border-2 border-gray-100 shadow-inner text-center">
                </div>
            </div>

            <p class="text-sm font-black text-stone-700 mb-3 bg-stone-100 inline-block px-3 py-1 rounded-lg">📍 擺攤位置設定</p>
            <div class="grid grid-cols-1 gap-4 mb-8">
                <div>
                    <label class="text-stone-900 text-sm font-black block mb-2 ml-1">市場名稱</label>
                    <input type="text" id="market_name" placeholder="例如：三民市場" class="w-full bg-gray-50 rounded-2xl p-4 text-lg font-bold border-2 border-gray-100 shadow-inner">
                </div>
                <div>
                    <label class="text-stone-900 text-sm font-black block mb-2 ml-1">具體位置 / 營業時間</label>
                    <input type="text" id="market_pos" placeholder="例如：自強路口 (08:00~12:00)" class="w-full bg-gray-50 rounded-2xl p-4 text-lg font-bold border-2 border-gray-100 shadow-inner">
                </div>
            </div>
            
            <label class="text-stone-900 text-sm font-black block mb-2 ml-1">切換今日營業狀態</label>
            <div class="grid grid-cols-3 gap-3 mb-8">
                <button onclick="setStatus('open')" id="btn_open" class="status-btn border-2 py-4 rounded-2xl text-md font-black bg-white">營業中</button>
                <button onclick="setStatus('soldout')" id="btn_soldout" class="status-btn border-2 py-4 rounded-2xl text-md font-black bg-white">已售完</button>
                <button onclick="setStatus('closed')" id="btn_closed" class="status-btn border-2 py-4 rounded-2xl text-md font-black bg-white">休息</button>
            </div>

            <button onclick="updateData()" class="w-full bg-green-600 text-white py-5 rounded-[2rem] text-xl font-black shadow-xl active:scale-95 transition-all flex items-center justify-center gap-2">
                儲存並同步設置 🚀
            </button>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, query, limitToLast, remove, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDcZovSDeUlF-SbWrgXY74ZCK7t5-VSnj4",
            authDomain: "studio-2370518507-ee5e3.firebaseapp.com",
            databaseURL: "https://studio-2370518507-ee5e3-default-rtdb.firebaseio.com",
            projectId: "studio-2370518507-ee5e3",
            appId: "1:143237430916:web:e66f040d02930a1a7e8cd1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        onValue(query(ref(db, 'orders'), limitToLast(50)), (snapshot) => {
            const listDiv = document.getElementById('orderList');
            const data = snapshot.val();
            if (!data) {
                listDiv.innerHTML = '<p class="text-gray-400 text-center py-10 font-bold">目前尚無預購訂單...</p>';
                document.getElementById('orderCount').innerText = 0;
                return;
            }
            const orders = Object.entries(data).reverse(); 
            document.getElementById('orderCount').innerText = orders.length;
            listDiv.innerHTML = orders.map(([id, order]) => `
                <div class="bg-stone-50 p-5 rounded-[1.5rem] border-2 border-white shadow-sm mb-4">
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex items-center gap-3">
                            <img src="${order.userPhoto || ''}" class="w-12 h-12 rounded-full border-2 border-white shadow-sm object-cover">
                            <div>
                                <p class="font-black text-lg text-stone-900">${order.userName || '客戶'}</p>
                                <p class="text-sm font-bold text-blue-600">${order.userPhone || ''}</p>
                            </div>
                        </div>
                        <button onclick="cancelOrder('${id}')" class="text-sm text-red-500 font-black px-2 py-1 bg-red-50 rounded-lg">取消</button>
                    </div>
                    <div class="text-md font-bold text-stone-600 bg-white p-3 rounded-xl border border-stone-100 mb-3">
                        ${order.items ? order.items.map(i => `<div class="flex justify-between"><span>• ${i.name}</span> <span>x ${i.qty}</span></div>`).join('') : ''}
                    </div>
                    <div class="flex justify-between items-center">
                        <p class="font-black text-2xl text-green-600">$${order.total}</p>
                        <button onclick="completeOrder('${id}')" class="bg-orange-500 text-white px-6 py-3 rounded-full text-md font-black shadow-lg active:scale-95 transition-all">收銀歸檔 💰</button>
                    </div>
                </div>
            `).join('');
        });

        window.completeOrder = async function(orderId) {
            try {
                const snap = await get(ref(db, `orders/${orderId}`));
                if (snap.exists()) {
                    const orderData = snap.val();
                    const now = new Date().toLocaleString();
                    await set(ref(db, `history_orders/${orderId}`), { ...orderData, completedTime: now, status: "已完成" });
                    await set(ref(db, 'pos_sync'), { orderId: orderId, amount: orderData.total, timestamp: Date.now(), msg: "預購轉現場結帳" });
                    await remove(ref(db, `orders/${orderId}`));
                    alert("歸檔成功！");
                }
            } catch (err) { alert("收銀失敗"); }
        };

        window.cancelOrder = (id) => { if(confirm("確定取消這筆訂單嗎？")) remove(ref(db, `orders/${id}`)); };

        onValue(ref(db, 'admin_settings'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if(data.prices){
                    document.getElementById('price_big_single').value = data.prices.big_s || 0;
                    document.getElementById('price_big_double').value = data.prices.big_d || 0;
                    document.getElementById('price_small_single').value = data.prices.small_s || 0;
                    document.getElementById('price_small_double').value = data.prices.small_d || 0;
                    document.getElementById('price_d1').value = data.prices.d1 || 250;
                    document.getElementById('price_d2').value = data.prices.d2 || 500;
                    document.getElementById('price_d3').value = data.prices.d3 || 750;
                }
                if(data.location){
                    document.getElementById('market_name').value = data.location.name || '';
                    document.getElementById('market_pos').value = data.location.pos || '';
                }
                updateStatusUI(data.status || 'open');
            }
        });

        window.updateData = () => {
            update(ref(db, 'admin_settings'), {
                prices: {
                    big_s: document.getElementById('price_big_single').value,
                    big_d: document.getElementById('price_big_double').value,
                    small_s: document.getElementById('price_small_single').value,
                    small_d: document.getElementById('price_small_double').value,
                    d1: document.getElementById('price_d1').value,
                    d2: document.getElementById('price_d2').value,
                    d3: document.getElementById('price_d3').value
                },
                location: {
                    name: document.getElementById('market_name').value,
                    pos: document.getElementById('market_pos').value,
                }
            }).then(() => alert("✅ 設置已成功同步！"));
        };

        window.setStatus = (s) => update(ref(db, 'admin_settings'), { status: s });

        function updateStatusUI(status) {
            document.querySelectorAll('.status-btn').forEach(b => {
                b.className = "status-btn border-2 border-gray-100 py-4 rounded-2xl text-md font-black bg-white text-gray-300";
            });
            const active = document.getElementById('btn_' + status);
            if(active) {
                if(status === 'open') active.className = "status-btn border-2 border-green-500 py-4 rounded-2xl text-md font-black bg-green-50 text-green-700 shadow-sm";
                if(status === 'soldout') active.className = "status-btn border-2 border-orange-500 py-4 rounded-2xl text-md font-black bg-orange-50 text-orange-700 shadow-sm";
                if(status === 'closed') active.className = "status-btn border-2 border-red-500 py-4 rounded-2xl text-md font-black bg-red-50 text-red-700 shadow-sm";
            }
            document.getElementById('currentStatusText').innerText = status === 'open' ? '🟢 營業中' : status === 'soldout' ? '🟡 已售完' : '🔴 休息中';
        }
    </script>
</body>
</html>
