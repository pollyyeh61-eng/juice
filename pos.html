<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收銀統計｜GUAVA HUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        /* 移除 hidden-content 樣式，讓內容直接顯示 */
        .btn-icon { transition: all 0.2s; }
        .btn-icon:active { transform: scale(0.85); }
    </style>
</head>
<body class="bg-stone-50 min-h-screen pb-10">

    <div id="main-content">
        <nav class="bg-white p-6 border-b border-stone-200 shadow-sm sticky top-0 z-50">
            <div class="max-w-4xl mx-auto flex justify-between items-center">
                <h1 class="text-2xl font-black text-stone-800">💰 收銀帳目統計</h1>
                <div class="flex gap-4">
                    <a href="admin.html" class="text-sm font-bold text-slate-500 hover:text-slate-800">回後台</a>
                    <a href="index.html" class="text-sm font-bold text-green-600 hover:text-green-800">回首頁</a>
                </div>
            </div>
        </nav>

        <main class="max-w-4xl mx-auto p-4 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-green-600 text-white p-6 rounded-[2rem] shadow-lg">
                    <p class="text-xs font-bold opacity-80 uppercase tracking-widest">今日收入</p>
                    <h2 class="text-4xl font-black mt-2">$<span id="day-total">0</span></h2>
                </div>
                <div class="bg-blue-600 text-white p-6 rounded-[2rem] shadow-lg">
                    <p class="text-xs font-bold opacity-80 uppercase tracking-widest">本週收入</p>
                    <h2 class="text-4xl font-black mt-2">$<span id="week-total">0</span></h2>
                </div>
                <div class="bg-stone-800 text-white p-6 rounded-[2rem] shadow-lg">
                    <p class="text-xs font-bold opacity-80 uppercase tracking-widest">全部收入 (累計)</p>
                    <h2 class="text-4xl font-black mt-2">$<span id="all-total">0</span></h2>
                </div>
            </div>

            <div class="bg-white rounded-[2rem] shadow-sm border border-stone-100 overflow-hidden">
                <div class="p-6 border-b border-stone-100 flex justify-between items-center">
                    <h3 class="font-bold text-lg">已完成訂單明細</h3>
                    <span class="text-xs bg-stone-100 px-3 py-1 rounded-full text-stone-500 font-bold" id="order-count">0 筆訂單</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-stone-50 text-stone-400 text-xs uppercase">
                            <tr>
                                <th class="p-4 font-bold">成交時間</th>
                                <th class="p-4 font-bold">客戶</th>
                                <th class="p-4 font-bold">金額</th>
                                <th class="p-4 font-bold text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="order-rows" class="text-sm divide-y divide-stone-50">
                            </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDcZovSDeULF-SbWrgXY74ZCK7t5-VSnj4",
            authDomain: "studio-2370518507-ee5e3.firebaseapp.com",
            databaseURL: "https://studio-2370518507-ee5e3-default-rtdb.firebaseio.com",
            projectId: "studio-2370518507-ee5e3",
            appId: "1:143237430916:web:e66f040d02930a1a7e8cd1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 頁面載入直接執行資料讀取
        window.onload = () => {
            loadFinances();
        };

        function loadFinances() {
            db.ref('history').on('value', snapshot => {
                const data = snapshot.val();
                const rows = document.getElementById('order-rows');
                if (!data) {
                    rows.innerHTML = '<tr><td colspan="4" class="p-10 text-center text-stone-400">尚無成交紀錄</td></tr>';
                    resetTotals();
                    return;
                }

                const records = Object.keys(data).map(key => ({
                    id: key,
                    ...data[key]
                })).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                let dayTotal = 0, allTotal = 0;
                const now = new Date();
                const todayStr = now.toDateString();

                rows.innerHTML = '';
                records.forEach(record => {
                    const recordDate = new Date(record.timestamp || 0);
                    const amount = parseInt(record.total) || 0;
                    allTotal += amount;
                    if (recordDate.toDateString() === todayStr) dayTotal += amount;

                    rows.innerHTML += `
                        <tr class="hover:bg-stone-50">
                            <td class="p-4 text-stone-500 text-[10px] leading-tight">
                                ${recordDate.toLocaleDateString()}<br>${recordDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                            </td>
                            <td class="p-4">
                                <div class="font-bold text-stone-800">${record.customer}</div>
                                <div class="text-[10px] text-stone-400 truncate w-32">${record.items}</div>
                            </td>
                            <td class="p-4 font-black text-green-600">$${amount}</td>
                            <td class="p-4">
                                <div class="flex gap-2 justify-center">
                                    <button onclick="archiveToAnnual('${record.id}')" title="存至年度收入" class="btn-icon bg-blue-50 text-blue-600 p-2 rounded-lg text-xs font-bold hover:bg-blue-100">📁 存</button>
                                    <button onclick="deleteOrder('${record.id}')" title="直接刪除" class="btn-icon bg-red-50 text-red-500 p-2 rounded-lg text-xs font-bold hover:bg-red-100">🗑️ 刪</button>
                                </div>
                            </td>
                        </tr>
                    `;
                });

                document.getElementById('day-total').innerText = dayTotal.toLocaleString();
                document.getElementById('all-total').innerText = allTotal.toLocaleString();
                document.getElementById('order-count').innerText = `${records.length} 筆訂單`;
            });
        }

        function deleteOrder(orderId) {
            if (confirm("確定要刪除這筆紀錄嗎？(無法復原)")) {
                db.ref('history/' + orderId).remove().then(() => alert("已成功刪除"));
            }
        }

        function archiveToAnnual(orderId) {
            if (confirm("要將此訂單歸檔至年度收入嗎？")) {
                db.ref('history/' + orderId).once('value', snap => {
                    const orderData = snap.val();
                    const year = new Date(orderData.timestamp).getFullYear();
                    db.ref('annual_revenue/' + year).push(orderData).then(() => {
                        return db.ref('history/' + orderId).remove();
                    }).then(() => alert("已歸檔至 " + year + " 年度收入清單！"));
                });
            }
        }

        function resetTotals() {
            document.getElementById('day-total').innerText = "0";
            document.getElementById('all-total').innerText = "0";
            document.getElementById('order-count').innerText = "0 筆訂單";
        }
    </script>
</body>
</html>
